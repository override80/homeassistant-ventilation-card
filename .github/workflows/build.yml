name: Build dist

on:
  push:
    branches: [ci/build-dist]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm run build
      - run: sha256sum dist/ventilation-card.js
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/ventilation-card.js
